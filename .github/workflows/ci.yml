name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --cwd packages/motion typecheck
      - run: bun --cwd packages/motion build
      - run: bun --cwd apps/example x tsc --noEmit
      - run: bun --cwd apps/docs build
