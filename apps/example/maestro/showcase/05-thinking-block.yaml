appId: dev.namimotion.example
name: 05 Thinking Block trace tabs
env:
  OUT: .
---
- stopApp
- openLink: namimotion:///showcase/thinking-block?driver=maestro
- extendedWaitUntil:
    visible: ".*Thinking.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 400
    optional: true
- takeScreenshot: ${OUT}/05-thinking-block-1-thinking
- extendedWaitUntil:
    visible: ".*Running the test.*"
    timeout: 6000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 500
    optional: true
- takeScreenshot: ${OUT}/05-thinking-block-2-reasoning
- extendedWaitUntil:
    visible: "Thought for .*"
    timeout: 8000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 800
    optional: true
- takeScreenshot: ${OUT}/05-thinking-block-3-done
- tapOn: "Thought for .*"
- extendedWaitUntil:
    visible: "Spot the Mersenne form"
    timeout: 5000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 700
    optional: true
- takeScreenshot: ${OUT}/05-thinking-block-4-steps
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Lucas-Lehmer primality test"
    timeout: 5000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 700
    optional: true
- takeScreenshot: ${OUT}/05-thinking-block-5-search
- tapOn: "Coding"
- extendedWaitUntil:
    visible: ".*is_mersenne_prime.*"
    timeout: 5000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 700
    optional: true
- takeScreenshot: ${OUT}/05-thinking-block-6-coding
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 1200
    optional: true
