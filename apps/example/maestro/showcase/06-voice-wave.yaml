appId: dev.namimotion.example
name: 06 Voice Wave dictation
env:
  OUT: .
---
- stopApp
- openLink: namimotion:///showcase/voice-wave?driver=maestro
- extendedWaitUntil:
    visible: "Listening"
    timeout: 30000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 500
    optional: true
- takeScreenshot: ${OUT}/06-voice-wave-1-listening
- extendedWaitUntil:
    visible: ".*Book a table for two.*"
    timeout: 6000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 900
    optional: true
- takeScreenshot: ${OUT}/06-voice-wave-2-speaking
- extendedWaitUntil:
    visible: ".*near the river.*"
    timeout: 8000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 300
    optional: true
- takeScreenshot: ${OUT}/06-voice-wave-3-transcribed
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 1800
    optional: true
- takeScreenshot: ${OUT}/06-voice-wave-4-in-composer
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 1500
    optional: true
