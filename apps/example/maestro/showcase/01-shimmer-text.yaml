appId: dev.namimotion.example
name: 01 Shimmer Text streaming answer
env:
  OUT: .
---
- stopApp
- openLink: namimotion:///showcase/shimmer-text?driver=maestro
- extendedWaitUntil:
    visible: "Reading the paper"
    timeout: 30000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 700
    optional: true
- takeScreenshot: ${OUT}/01-shimmer-text-1-reading
- extendedWaitUntil:
    visible: "Generating a response"
    timeout: 5000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 1400
    optional: true
- takeScreenshot: ${OUT}/01-shimmer-text-2-streaming
- extendedWaitUntil:
    visible: "Finished in 5s"
    timeout: 8000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 300
    optional: true
- takeScreenshot: ${OUT}/01-shimmer-text-3-done
- extendedWaitUntil:
    visible: "Which tasks\\?"
    timeout: 5000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 500
    optional: true
- takeScreenshot: ${OUT}/01-shimmer-text-4-follow-ups
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 2000
    optional: true
