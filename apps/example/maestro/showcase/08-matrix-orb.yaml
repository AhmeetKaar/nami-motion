appId: dev.namimotion.example
name: 08 Matrix Orb voice mode
env:
  OUT: .
---
- stopApp
- openLink: namimotion:///showcase/matrix-orb?driver=maestro
- extendedWaitUntil:
    visible: "Tap to talk"
    timeout: 30000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 600
    optional: true
- takeScreenshot: ${OUT}/08-matrix-orb-1-idle
- extendedWaitUntil:
    visible: "What should I cook tonight?"
    timeout: 5000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 900
    optional: true
- takeScreenshot: ${OUT}/08-matrix-orb-2-listening
- extendedWaitUntil:
    visible: "Thinking"
    timeout: 5000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 700
    optional: true
- takeScreenshot: ${OUT}/08-matrix-orb-3-thinking
- extendedWaitUntil:
    visible: ".*lemon garlic pasta.*"
    timeout: 5000
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 800
    optional: true
- takeScreenshot: ${OUT}/08-matrix-orb-4-answer
- extendedWaitUntil:
    visible: "maestro-hold"
    timeout: 1500
    optional: true
