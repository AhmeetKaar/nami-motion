appId: dev.namimotion.example
name: Swipe actions gesture in gallery
---
- launchApp
- extendedWaitUntil:
    visible: ".*Shimmer Text.*"
    timeout: 30000
- scrollUntilVisible:
    element: ".*Bug triage.*"
    direction: DOWN
- scroll
- scroll
- swipe:
    start: "60%,74%"
    end: "15%,74%"
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: example-swipe-open
